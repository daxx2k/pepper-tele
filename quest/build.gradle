plugins { id 'com.android.application' }
android {
    namespace 'it.telepepper.quest'
    compileSdk 34
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'it.telepepper.quest25'
        minSdk 29
        targetSdk 32
        versionCode 8
        versionName '0.3.9-pepper25-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2 -Wall -Wextra'; arguments '-DANDROID_STL=c++_shared' } }
    }
    sourceSets { main { java.srcDirs += ['../config/android/java']; res.srcDirs += ['../config/android/res'] } }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}
def bridgeAssets = new File(buildDir, 'generated/pepper25-assets')
android.sourceSets.main.assets.srcDir bridgeAssets
tasks.register('bundlePepper25Bridge', Copy) {
    from(rootProject.file('pepper/bridge')) { include '*.py' }
    into(new File(bridgeAssets, 'pepper25'))
}
tasks.named('preBuild').configure { dependsOn 'bundlePepper25Bridge' }
dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.54'
    implementation 'com.github.mwiede:jsch:0.1.72'
}
